<VirtualHost *:443>
    ServerName localhost

    SSLEngine on
    SSLCertificateFile "/etc/pki/tls/certs/apache.crt"
    SSLCertificateKeyFile "/etc/pki/tls/private/apache.key"

    DocumentRoot /var/www/html
</VirtualHost>

<VirtualHost *:80>
    Redirect permanent / https://localhost/
</VirtualHost>
